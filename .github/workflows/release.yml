name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: archive-gui-windows-x64.exe
          - os: ubuntu-latest
            asset_name: archive-gui-linux-x64
          - os: macos-latest
            asset_name: archive-gui-macos-arm64
          - os: macos-14
            asset_name: archive-gui-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Core
        run: cmake --build build --config Release

      - name: Package with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller --noconsole --onefile --add-data "python\*.pyd;." python\gui.py

      - name: Package with PyInstaller (Unix)
        if: matrix.os != 'windows-latest'
        run: pyinstaller --noconsole --onefile --add-data "python/*.so:." python/gui.py

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: move dist\gui.exe ${{ matrix.asset_name }}

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: mv dist/gui ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}